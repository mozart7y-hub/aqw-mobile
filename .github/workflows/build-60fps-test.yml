name: Inspect AQW SWF Framerates

on:
  workflow_dispatch:

jobs:
  inspect-all-swfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4

      - name: Download AQW Pocket v3.3.6 armv8
        run: |
          curl -L \
            "https://github.com/anthony-hyo/aqw-mobile/releases/download/v3.3.6/AQWPocket-v3.3.6-armv8.apk" \
            -o AQWPocket.apk

      - name: Extract APK
        run: |
          mkdir extracted-apk
          unzip -q AQWPocket.apk -d extracted-apk

      - name: Inspect all SWF framerates
        run: |
          python3 - <<'PY'
          import zlib
          from pathlib import Path

          files = [
              Path("extracted-apk/assets/Mobile.swf"),
              Path("extracted-apk/assets/gamefiles/game.swf"),
              Path("extracted-apk/assets/gamefiles/world-map.swf"),
              Path("extracted-apk/assets/gamefiles/book-of-lore.swf"),
              Path("extracted-apk/assets/gamefiles/character-select.swf"),
          ]

          def read_swf(path):
              raw = path.read_bytes()
              signature = raw[:3]

              if signature == b"CWS":
                  body = zlib.decompress(raw[8:])
              elif signature == b"FWS":
                  body = raw[8:]
              else:
                  return {
                      "signature": signature.decode(
                          errors="replace"
                      ),
                      "fps": "Unsupported",
                      "frames": "?"
                  }

              nbits = body[0] >> 3
              rect_bits = 5 + (nbits * 4)
              rect_bytes = (rect_bits + 7) // 8

              fps_raw = int.from_bytes(
                  body[rect_bytes:rect_bytes + 2],
                  "little"
              )

              frame_count = int.from_bytes(
                  body[rect_bytes + 2:rect_bytes + 4],
                  "little"
              )

              return {
                  "signature": signature.decode(),
                  "fps": fps_raw / 256.0,
                  "frames": frame_count
              }

          print("")
          print("========== AQW SWF FPS RESULTS ==========")

          for path in files:
              info = read_swf(path)

              print("")
              print(f"FILE: {path.name}")
              print(f"Compression: {info['signature']}")
              print(f"Frame rate: {info['fps']}")
              print(f"Frame count: {info['frames']}")

          print("")
          print("=========================================")
          PY
