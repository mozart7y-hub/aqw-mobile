name: AQW SWF Framerate Test

on:
  workflow_dispatch:

jobs:
  inspect-framerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4

      - name: Download AQW Pocket v3.3.6 armv8
        run: |
          curl -L \
            "https://github.com/anthony-hyo/aqw-mobile/releases/download/v3.3.6/AQWPocket-v3.3.6-armv8.apk" \
            -o AQWPocket.apk

      - name: Extract APK
        run: |
          mkdir extracted-apk
          unzip -q AQWPocket.apk -d extracted-apk

      - name: Read Mobile.swf framerate
        run: |
          python3 - <<'PY'
          import zlib
          from pathlib import Path

          path = Path("extracted-apk/assets/Mobile.swf")
          raw = path.read_bytes()

          signature = raw[:3]
          version = raw[3]
          declared_length = int.from_bytes(raw[4:8], "little")

          if signature == b"CWS":
              body = zlib.decompress(raw[8:])
          elif signature == b"FWS":
              body = raw[8:]
          else:
              raise RuntimeError(
                  f"Unsupported SWF signature: {signature!r}"
              )

          # SWF RECT begins immediately after the 8-byte SWF header.
          # First 5 bits specify the number of bits used for each RECT value.
          nbits = body[0] >> 3
          rect_bits = 5 + (nbits * 4)
          rect_bytes = (rect_bits + 7) // 8

          # Immediately following RECT is the UI16 8.8 fixed-point frame rate.
          rate_offset = rect_bytes
          rate_raw = int.from_bytes(
              body[rate_offset:rate_offset + 2],
              "little"
          )
          frame_rate = rate_raw / 256.0

          frame_count = int.from_bytes(
              body[rate_offset + 2:rate_offset + 4],
              "little"
          )

          print("=== MOBILE.SWF INFORMATION ===")
          print(f"Signature: {signature.decode()}")
          print(f"SWF version: {version}")
          print(f"Declared length: {declared_length}")
          print(f"Frame rate: {frame_rate}")
          print(f"Frame count: {frame_count}")
          print("================================")
          PY
