name: AQW 60FPS SWF Patch Test

on:
  workflow_dispatch:

jobs:
  patch-framerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4

      - name: Download AQW Pocket v3.3.6 armv8
        run: |
          curl -L \
            "https://github.com/anthony-hyo/aqw-mobile/releases/download/v3.3.6/AQWPocket-v3.3.6-armv8.apk" \
            -o AQWPocket.apk

      - name: Extract APK
        run: |
          mkdir extracted-apk
          unzip -q AQWPocket.apk -d extracted-apk

      - name: Patch Mobile.swf from 30 FPS to 60 FPS
        run: |
          python3 - <<'PY'
          import zlib
          from pathlib import Path

          path = Path("extracted-apk/assets/Mobile.swf")
          raw = path.read_bytes()

          signature = raw[:3]
          version = raw[3]
          declared_length = int.from_bytes(raw[4:8], "little")

          if signature == b"CWS":
              body = bytearray(zlib.decompress(raw[8:]))
          elif signature == b"FWS":
              body = bytearray(raw[8:])
          else:
              raise RuntimeError(
                  f"Unsupported SWF signature: {signature!r}"
              )

          # Locate the frame-rate field after the SWF RECT.
          nbits = body[0] >> 3
          rect_bits = 5 + (nbits * 4)
          rect_bytes = (rect_bits + 7) // 8
          rate_offset = rect_bytes

          old_raw = int.from_bytes(
              body[rate_offset:rate_offset + 2],
              "little"
          )
          old_rate = old_raw / 256.0

          print(f"Original frame rate: {old_rate}")

          if old_rate != 30.0:
              raise RuntimeError(
                  f"Expected 30 FPS but found {old_rate}"
              )

          # SWF stores frame rate as an unsigned 8.8 fixed-point value.
          new_rate = 60.0
          new_raw = int(new_rate * 256)

          body[rate_offset:rate_offset + 2] = \
              new_raw.to_bytes(2, "little")

          # Preserve CWS compression used by the original Mobile.swf.
          if signature == b"CWS":
              patched = (
                  b"CWS"
                  + bytes([version])
                  + declared_length.to_bytes(4, "little")
                  + zlib.compress(bytes(body), 9)
              )
          else:
              patched = (
                  b"FWS"
                  + bytes([version])
                  + declared_length.to_bytes(4, "little")
                  + bytes(body)
              )

          path.write_bytes(patched)

          print("Mobile.swf patched successfully.")
          PY

      - name: Verify Mobile.swf is now 60 FPS
        run: |
          python3 - <<'PY'
          import zlib
          from pathlib import Path

          path = Path("extracted-apk/assets/Mobile.swf")
          raw = path.read_bytes()

          if raw[:3] == b"CWS":
              body = zlib.decompress(raw[8:])
          elif raw[:3] == b"FWS":
              body = raw[8:]
          else:
              raise RuntimeError("Unsupported SWF")

          nbits = body[0] >> 3
          rect_bits = 5 + (nbits * 4)
          rect_bytes = (rect_bits + 7) // 8

          rate_raw = int.from_bytes(
              body[rect_bytes:rect_bytes + 2],
              "little"
          )

          frame_rate = rate_raw / 256.0

          print("=== PATCH RESULT ===")
          print(f"Frame rate: {frame_rate}")
          print("====================")

          if frame_rate != 60.0:
              raise RuntimeError("60 FPS verification failed")
          PY

      - name: Upload patched Mobile.swf
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-SWF-60FPS
          path: extracted-apk/assets/Mobile.swf
