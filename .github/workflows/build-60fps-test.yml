name: AQW 60FPS Compile Test

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my fork
        uses: actions/checkout@v4

      - name: Setup AIR SDK
        uses: joshtynjala/setup-adobe-air-action@v2
        with:
          air-version: "51.3.1"
          accept-license: yes

      - name: Show AIR compiler tools
        run: |
          which mxmlc || true
          which amxmlc || true
          mxmlc -version || true
          amxmlc -version || true

      - name: Compile modified Mobile.swf
        run: |
          mxmlc \
            -source-path+=loader/src \
            -library-path+=loader/libs \
            -output=loader/Mobile-60fps.swf \
            loader/src/Pocket.as

      - name: Verify compiled SWF
        run: |
          ls -lh loader/Mobile-60fps.swf
          file loader/Mobile-60fps.swf

      - name: Upload compiled SWF
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-60fps-test
          path: loader/Mobile-60fps.swf
